[project]
name = "logoneef"
version = "0.1.0"
description = "Parametric logo GUI with marimo and svgwrite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.1",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "resvg-py>=0.5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.marimo.formatting]
line_length = 88

[tool.marimo.display]
theme = "system"

[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"
